  - R40
adr_path: docs/adr/0001-observer-effect-measurement-contract.md
adr_revision: proposed-working-tree
protocol: sia-observer-v1
dataset_status: unexecuted
claim_permitted: false
claim_note: An unexecuted schema is not evidence of low observer effect.

analysis_contract:
  unit: independent matched pair
  pair_effect_ratio: log(enabled / disabled)
  pair_effect_difference: enabled - disabled
  required_conclusions: 23
  family_confidence: 0.95
  multiplicity: two-sided Bonferroni over 23 conclusions
  individual_confidence: 0.9978260869565218
  interval_method: sequence-stratified studentized paired bootstrap
  bootstrap_replicates: 20000
  bootstrap_unit: complete pair
  decision: complete adjusted interval must lie strictly inside both limits
  minimum_final_pairs_per_workload: 30
  maximum_final_attempted_pairs_per_workload: 200
  pilot_pairs_per_workload: 20
  pilot_in_final_analysis: false
  precision_target: adjusted interval half-width at most half the margin
  early_stopping: prohibited

workloads:
  - id: cpu_hash_v1
    duration_s: 600
    warmup_s: 120
    seed_hex: 5349412d4350552d5631
    concurrency: max(1, logical_cpu_count - 1)
    input: deterministic 64 MiB buffer per worker
    target_metric: completed bytes per second
    gui_active: false
  - id: storage_stream_v1
    duration_s: 600
    warmup_s: 120
    seed_hex: 5349412d494f2d5631
    concurrency: 1
    input: deterministic 64 GiB file, sequential direct reads in 4 MiB blocks
    target_metric: completed bytes per second
    gui_active: false
  - id: gpu_compute_v1
    duration_s: 600
    warmup_s: 120
    seed_hex: 5349412d4750552d5631
    concurrency: one process and one accelerator queue
    input: deterministic FP32 Mandelbrot kernel at 8192 by 8192 pixels
    target_metric: completed pixels per second
    gui_active: false
  - id: gui_replay_v1
    duration_s: 600
    warmup_s: 120
    seed_hex: 5349412d4755492d5631
    concurrency: one 60 Hz replay stream
    input: versioned gui-replay-v1 ten-minute trace
    target_metric: presented frames per second
    gui_active: true

endpoints:
  target_throughput:
    unit: workload units per second
    aggregation: completed units divided by authoritative boundary seconds
    effect_scale: log_ratio
    margin_lower: -0.01980262729617973
    margin_upper: 0.01980262729617973
  sia_cpu_core_fraction:
    unit: cores
    aggregation: SIA process CPU seconds divided by authoritative boundary seconds
    effect_scale: difference
    margin_lower: -0.005
    margin_upper: 0.005
  sia_peak_rss_mib:
    unit: MiB
    aggregation: maximum SIA resident set within authoritative boundary
    effect_scale: difference
    margin_lower: -16
    margin_upper: 16
  sia_io_mib_s:
    unit: MiB/s
    aggregation: SIA read plus write bytes divided by authoritative boundary seconds
    effect_scale: difference
    margin_lower: -1
    margin_upper: 1
  target_gpu_clock_mhz:
    unit: MHz
    aggregation: time-weighted mean target GPU core clock
    effect_scale: difference
    margin_lower: -30
    margin_upper: 30
  target_gpu_power_w:
    unit: W
    aggregation: time-weighted mean target GPU board power
    effect_scale: difference
    margin_lower: -3
    margin_upper: 3
  target_gpu_temperature_c:
    unit: degrees C
    aggregation: maximum steady-state target GPU temperature
    effect_scale: difference
    margin_lower: -2
    margin_upper: 2
  sia_gpu_busy_pct:
    unit: percentage points
    aggregation: time-weighted mean SIA GPU-engine activity
    effect_scale: difference
    margin_lower: -1
    margin_upper: 1

