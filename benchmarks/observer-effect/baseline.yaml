    - sample_loss_rate
    - collector_lateness_p50_ms
    - collector_lateness_p95_ms
    - collector_lateness_max_ms
    - late_sample_count
    - collector_errors
    - synchronization_status
    - flush_export_teardown_complete
  environment_required_fields:
    - warmup_complete
    - cache_reset_status
    - starting_cpu_temperature_c
    - ending_cpu_temperature_c
    - starting_gpu_temperature_c
    - ending_gpu_temperature_c
    - thermal_throttle
    - power_throttle
    - background_cpu_max_pct
    - background_cpu_over_limit_s
    - swap_bytes
    - memory_pressure
    - unexpected_io_mib_s
    - unexpected_io_over_limit_s
    - carryover_status
  objective_exclusion_rules:
    - any thermal or power throttle flag
    - cache reset failure
    - background CPU above 2 percent for over 5 consecutive seconds
    - any swap activity or memory pressure
    - unexpected external I/O above 5 MiB/s for 5 seconds
    - pre-arm temperature outside 2 degrees C of pair baseline
    - sample loss above 1 percent
    - collector error
    - maximum lateness above two sampling periods
  non_excludable_inconclusive_events:
    - target crash
    - SIA crash
    - enabled-only failure
    - timeout after 750 seconds
    - missing endpoint
    - censoring
    - missing quality field

