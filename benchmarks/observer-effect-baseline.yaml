schema_version: 1
artifact_status: proposed
execution_status: unexecuted
claim_permitted: false
specification:
  revision: 4479bcc19db72f6ad243a87e4b7271496d60d0b7
  requirements: [R01, R12, R38, R40]
adr:
  path: docs/adr/0001-observer-effect-benchmark.md
  revision: required-before-execution
source_revision: 4479bcc19db72f6ad243a87e4b7271496d60d0b7

analysis:
  unit: independent matched pair
  effect_ratio: enabled / disabled - 1
  effect_absolute: enabled - disabled
  confidence_family: 0.95
  required_conclusions: 21
  interval_method: paired BCa bootstrap
  bootstrap_resamples: 100000
  bootstrap_seed: 8675309
  resampling_unit: whole matched pair
  per_interval_confidence: 0.997619047619
  multiplicity: Bonferroni across 21 required conclusions
  pass_rule: complete adjusted interval strictly inside both symmetric margins
  overall_rule: all required conclusions must pass
  pilot_pairs_per_workload: 12
  pilot_in_final_analysis: false
  minimum_final_pairs_per_workload: 30
  maximum_attempted_pairs_per_workload: 200
  precision_target: adjusted interval half-width at most one half of margin half-width
  stopping_rule: fixed sample size computed from pilot variance; no outcome-dependent early stopping

randomization:
  generator: PCG64
  seed: 424242
  method: counterbalanced two-pair blocks with seeded order within each block

quality_limits:
  maximum_sample_loss_rate: 0.001
  maximum_collector_lateness_fraction_of_interval: 0.10
  maximum_background_cpu_fraction: 0.02
  maximum_background_cpu_duration_seconds: 5
  maximum_background_io_bytes_per_second: 10485760
  maximum_background_io_duration_seconds: 5
  maximum_gpu_precondition_delta_celsius: 2
  maximum_stabilization_seconds: 900
  maximum_harness_cost_fraction_of_smallest_margin: 0.10

workloads:
  - id: cpu_batch
    definition: deterministic SHA-256 stream over 64 GiB
    seed: 104729
    concurrency: 1
    duration_policy: run to completion
    input_bytes: 68719476736
    executable_digest: required-before-execution
    input_digest: required-before-execution
    expected_output_digest: required-before-execution
    cache_reset: drop workload-owned cache and verify reset before each arm
    warmup: one unmeasured arm-specific run
    required_endpoints: [target_elapsed_time_ns, sia_cpu_core_fraction, sia_peak_rss_bytes, sia_read_rate_bytes_per_second, sia_write_rate_bytes_per_second]
  - id: gpu_compute
    definition: repeated 4096 by 4096 FP32 matrix multiplication
    seed: 130363
    concurrency: 1
    measured_duration_seconds: 300
    executable_digest: required-before-execution
    input_digest: required-before-execution
    expected_output_digest: required-before-execution
    cache_reset: synchronize device, release allocations, and verify idle device before each arm
    warmup: one unmeasured arm-specific run
    required_endpoints: [target_elapsed_time_ns, sia_cpu_core_fraction, sia_peak_rss_bytes, sia_read_rate_bytes_per_second, sia_write_rate_bytes_per_second, target_gpu_clock_ratio, target_gpu_power_ratio, target_gpu_temperature_delta_celsius]
  - id: gui_active
    definition: fixed SIA GUI trace at 1920 by 1080 and 60 Hz
    seed: 155921
    concurrency: 1
    measured_duration_seconds: 300
    executable_digest: required-before-execution
    trace_digest: required-before-execution
    expected_output_digest: required-before-execution
    cache_reset: restart GUI session from clean profile and verify idle device before each arm
    warmup: one unmeasured arm-specific trace replay
    required_endpoints: [target_frame_time_p99_ms, sia_cpu_core_fraction, sia_peak_rss_bytes, sia_read_rate_bytes_per_second, sia_write_rate_bytes_per_second, target_gpu_clock_ratio, target_gpu_power_ratio, target_gpu_temperature_delta_celsius]

endpoint_definitions:
  target_elapsed_time_ns:
    unit: ns
    aggregation: external monotonic end minus start including setup, synchronization, validation, flush, export, and teardown
    effect: ratio
    margin_lower: -0.02
    margin_upper: 0.02
  target_frame_time_p99_ms:
    unit: ms
    aggregation: nearest-rank p99 from retained per-frame distribution
    effect: ratio
    margin_lower: -0.02
    margin_upper: 0.02
  sia_cpu_core_fraction:
    unit: core_fraction
    aggregation: SIA user plus system CPU time divided by externally measured trial duration
    effect: absolute
    margin_lower: -0.005
    margin_upper: 0.005
  sia_peak_rss_bytes:
    unit: bytes
    aggregation: maximum SIA resident-set size during measurement boundary
    effect: absolute
    margin_lower: -67108864
    margin_upper: 67108864
  sia_read_rate_bytes_per_second:
    unit: bytes_per_second
    aggregation: SIA process read bytes divided by externally measured trial duration
    effect: absolute
    margin_lower: -1048576
    margin_upper: 1048576
  sia_write_rate_bytes_per_second:
    unit: bytes_per_second
    aggregation: SIA process write bytes divided by externally measured trial duration
    effect: absolute
    margin_lower: -1048576
    margin_upper: 1048576
  target_gpu_clock_ratio:
    unit: ratio
    aggregation: ratio of enabled and disabled time-weighted mean target GPU clock
    effect: ratio
    margin_lower: -0.02
    margin_upper: 0.02
  target_gpu_power_ratio:
    unit: ratio
    aggregation: ratio of enabled and disabled time-weighted mean target GPU power
    effect: ratio
    margin_lower: -0.03
    margin_upper: 0.03
  target_gpu_temperature_delta_celsius:
    unit: degrees_celsius
    aggregation: difference of enabled and disabled time-weighted mean target GPU temperature
    effect: absolute
    margin_lower: -2
    margin_upper: 2

