endpoint_definitions:
  target_elapsed_time:
    unit: ms
    aggregation: external_monotonic_boundary_duration
    effect: enabled_over_disabled_ratio
    analysis_scale: log
    margin: {lower: 0.98, upper: 1.02}
  target_throughput:
    unit: workload_unit_per_second
    aggregation: completed_work_over_measured_seconds
    effect: enabled_over_disabled_ratio
    analysis_scale: log
    margin: {lower: 0.98, upper: 1.02}
  sia_cpu_time:
    unit: ms
    aggregation: process_tree_user_plus_system
    effect: enabled_minus_disabled
    analysis_scale: identity
    margin: {lower: -3000, upper: 3000}
  sia_peak_rss:
    unit: bytes
    aggregation: process_tree_maximum
    effect: enabled_minus_disabled
    analysis_scale: identity
    margin: {lower: -209715200, upper: 209715200}
  sia_read_bytes:
    unit: bytes
    aggregation: process_tree_total
    effect: enabled_minus_disabled
    analysis_scale: identity
    margin: {lower: -16777216, upper: 16777216}
  sia_write_bytes:
    unit: bytes
    aggregation: process_tree_total_including_export_and_teardown
    effect: enabled_minus_disabled
    analysis_scale: identity
    margin: {lower: -16777216, upper: 16777216}
  target_gpu_clock:
    unit: MHz
    aggregation: external_time_weighted_mean
    effect: enabled_over_disabled_ratio
    analysis_scale: log
    margin: {lower: 0.98, upper: 1.02}
  target_gpu_power:
    unit: W
    aggregation: external_time_weighted_mean
    effect: enabled_over_disabled_ratio
    analysis_scale: log
    margin: {lower: 0.98, upper: 1.02}
  target_gpu_temperature:
    unit: degC
    aggregation: external_maximum
    effect: enabled_minus_disabled
    analysis_scale: identity
    margin: {lower: -2, upper: 2}
  sia_gpu_activity:
    unit: percentage_points
    aggregation: attributed_time_weighted_mean
    effect: enabled_minus_disabled
    analysis_scale: identity
    margin: {lower: -1, upper: 1}
