adr_path: docs/adr/0001-low-observer-effect-benchmark.md
adr_revision: proposed-uncommitted
requirement_trace:
  - R01
  - R12
  - R38
  - R40

analysis:
  unit: independent_adjacent_matched_pair
  alpha_familywise: 0.05
  coverage_familywise: 0.95
  multiplicity: bonferroni_two_sided_over_all_required_workload_endpoint_combinations
  interval: paired_stratified_percentile_bootstrap
  bootstrap_resamples: 100000
  bootstrap_seed: 32452843
  resampling_unit: complete_pair_within_workload_and_order_sequence
  ratio_scale: log
  equivalence_rule: complete_adjusted_interval_strictly_inside_symmetric_margin
  pilot_pairs_per_workload: 10
  pilot_in_final_analysis: false
  confirmatory_minimum_pairs_per_workload: 30
  confirmatory_maximum_pairs_per_workload: 200
  planning_power_at_zero_effect: 0.90
  precision_target: adjusted_interval_half_width_not_greater_than_margin
  stopping: fixed_sample_no_interim_analysis_no_optional_stopping
  sample_size_rule: ceil(((z(1-0.05/(2*K))+z(0.90))*pilot_sd/margin)^2), maximum across required endpoints, then clamp to minimum 30; above 200 is inconclusive

quality_gates:
  sample_loss_rate_max: 0.001
  collector_lateness_p99_sampling_intervals_max: 2
  collector_lateness_max_sampling_intervals_max: 5
  harness_median_timing_cost_fraction_max: 0.005
  harness_adjusted_interval_upper_fraction_max: 0.01
  invalid_pair_fraction_max: 0.10
  target_hardware_match_required: true
  representative_real_trace_required_for_target_claim: true
  complete_provenance_required: true
  complete_endpoint_coverage_required: true

workloads:
  - id: cpu_compute
    required: true
    synthetic: true
    seed: 104729
    duration_s: 600
    warmup_s: 60
    concurrency: {processes: 1, workers: 1}
    definition: repeatedly hash deterministic 1 MiB generated blocks
    required_endpoints: [target_elapsed_time_ms, target_throughput_units_per_s, sia_cpu_time_ms, sia_rss_peak_bytes, sia_io_read_bytes, sia_io_write_bytes]
  - id: io_pipeline
    required: true
    synthetic: true
    seed: 130363
    duration_s: 600
    warmup_s: 60
    concurrency: {processes: 1, workers: 1}
    definition: repeatedly sequentially write and read an 8 GiB deterministic data set in 64 KiB blocks with fsync after each GiB
    required_endpoints: [target_elapsed_time_ms, target_throughput_units_per_s, sia_cpu_time_ms, sia_rss_peak_bytes, sia_io_read_bytes, sia_io_write_bytes]
  - id: gui_interaction
    required: true
    synthetic: true
    seed: 155921
    duration_s: 600
    warmup_s: 60
    concurrency: {target_sessions: 1, display_width_px: 1920, display_height_px: 1080, refresh_hz: 60}
    definition: deterministic trace of window creation, text entry, scrolling, image compositing, resize, and close operations
    required_endpoints: [target_elapsed_time_ms, target_throughput_units_per_s, sia_cpu_time_ms, sia_rss_peak_bytes, sia_io_read_bytes, sia_io_write_bytes, target_gpu_clock_mhz, target_gpu_power_w, target_gpu_temperature_c, sia_gpu_activity_pct]
  - id: gpu_compute
    required: true
    synthetic: true
    seed: 196613
    duration_s: 600
    warmup_s: 60
    concurrency: {host_submission_threads: 1, device_queues: 1}
    definition: alternate deterministic matrix-multiplication and image-compositing kernels, synchronizing each one-second epoch
    required_endpoints: [target_elapsed_time_ms, target_throughput_units_per_s, sia_cpu_time_ms, sia_rss_peak_bytes, sia_io_read_bytes, sia_io_write_bytes, target_gpu_clock_mhz, target_gpu_power_w, target_gpu_temperature_c, sia_gpu_activity_pct]

endpoints:
  target_elapsed_time_ms: {unit: ms, aggregation: distribution_and_trial_total, effect: enabled_over_disabled_minus_one, margin: 0.03, margin_unit: fraction}
  target_throughput_units_per_s: {unit: units/s, aggregation: distribution_and_trial_mean, effect: one_minus_enabled_over_disabled, margin: 0.03, margin_unit: fraction}
  sia_cpu_time_ms: {unit: ms, aggregation: process_user_plus_system_over_complete_boundary, effect: enabled_minus_disabled, margin: 300, margin_unit: ms_per_60s}
  sia_rss_peak_bytes: {unit: byte, aggregation: trial_maximum, effect: enabled_minus_disabled, margin: 67108864, margin_unit: byte}
  sia_io_read_bytes: {unit: byte, aggregation: process_attributed_trial_total, effect: enabled_minus_disabled, margin: 5242880, margin_unit: byte}
  sia_io_write_bytes: {unit: byte, aggregation: process_attributed_trial_total, effect: enabled_minus_disabled, margin: 5242880, margin_unit: byte}
  target_gpu_clock_mhz: {unit: MHz, aggregation: synchronized_time_weighted_mean, effect: disabled_over_enabled_minus_one, margin: 0.03, margin_unit: fraction}
  target_gpu_power_w: {unit: W, aggregation: time_weighted_mean_and_maximum, effect: enabled_minus_disabled, margin: 5, margin_unit: W}
  target_gpu_temperature_c: {unit: degC, aggregation: time_weighted_mean_and_maximum, effect: enabled_minus_disabled, margin: 2, margin_unit: degC}
  sia_gpu_activity_pct: {unit: percentage_point, aggregation: synchronized_time_weighted_mean, effect: enabled_minus_disabled, margin: 1, margin_unit: percentage_point}

