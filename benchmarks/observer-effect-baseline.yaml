schema_version: 1
artifact: sia-observer-effect-baseline
status: proposed
execution_status: not_run
specification_sha: 4479bcc19db72f6ad243a87e4b7271496d60d0b7
requirements:
  - R01
  - R12
  - R38
  - R40
adr:
  path: docs/adr/0001-observer-effect-test.md
  revision: pending_materialization
claim_policy:
  permitted: false
  reason: preregistered schema has not been executed on declared target hardware
  overall_rule: every required workload-endpoint result for a scope must pass; fail, missing, or inconclusive prevents pass
scopes:
  - id: headless_monitor
    disabled_arm: matched wrapper with observation disabled
    enabled_arm: target-local headless recording with frozen monitor plan
  - id: headless_profile
    disabled_arm: matched wrapper with observation disabled
    enabled_arm: target-local headless recording with frozen profile plan
  - id: encrypted_observer
    disabled_arm: target-local headless recording without observer
    enabled_arm: identical recording with one encrypted off-target observer
  - id: live_gui
    disabled_arm: matched wrapper with observation disabled
    enabled_arm: local GUI collection
provenance:
  evidence_class: pending
  source_revision: pending
  baseline_revision: pending
  fixture_revision: pending
  configuration_revision: pending
  observer_mode_revision: pending
  host_os: pending
  host_kernel: pending
  boot_id: pending
  time_namespace_identity: pending
  cpu_model: pending
  cpu_topology: pending
  memory_bytes: pending
  accelerator_model: pending
  accelerator_identity: pending
  driver_version: pending
  runtime_version: pending
  power_settings: pending
  frequency_settings: pending
  governor: pending
  affinity_policy: pending
  ambient_controls: pending
  filesystem: pending
  environment_allowlist: pending
  measurement_tools: []
workloads:
  - {id: cpu_single, input: deterministic-kernels-seed-23063, concurrency: 1-pinned-worker, final_policy: fixed-work}
  - {id: cpu_multi, input: deterministic-kernels-seed-family-23063, concurrency: one-pinned-worker-per-physical-core, final_policy: fixed-work}
  - {id: memory_pressure, input: deterministic-traversal-of-70-percent-physical-memory, concurrency: physical-core-count-workers, final_policy: 120-seconds}
  - {id: disk_io, input: deterministic-8-GiB-payload, concurrency: one-worker-queue-depth-1, final_policy: write-sync-read-verify}
  - {id: gpu_compute, input: deterministic-fixed-kernels-seed-23063, concurrency: one-feeder-one-stream, final_policy: at-least-120-seconds-fixed-work}
  - {id: gpu_transfer, input: deterministic-fixed-bidirectional-byte-count, concurrency: one-host-thread-one-stream, final_policy: at-least-120-seconds-fixed-work}
  - {id: gpu_thermal_power, input: gpu-compute-under-declared-existing-policy, concurrency: one-feeder-one-stream, final_policy: 600-seconds-in-frozen-stratum}
  - {id: mixed_cpu_gpu, input: deterministic-pipeline-seed-23063, concurrency: frozen-workers-and-one-stream, final_policy: at-least-180-seconds-fixed-work}
characterization_fixtures:
  - idle_machine
  - long_recording
  - suspend_resume
  - short_burst_aliasing
endpoint_catalog:
  target_elapsed:
    unit: seconds
    aggregation: external complete-invocation elapsed time; raw target distribution retained
    effect: enabled_over_disabled_geometric_ratio
    margin: {lower: 0.98, upper: 1.02}
    required_for: all_workloads
  target_throughput:
    unit: declared_work_units_per_second
    aggregation: verified total work divided by authoritative external elapsed time; raw distribution retained
    effect: enabled_over_disabled_geometric_ratio
    margin: {lower: 0.98, upper: 1.02}
    required_for: all_workloads
  gpu_sm_clock:
    unit: MHz
    aggregation: measured-interval time-weighted mean; raw distribution retained
    effect: enabled_over_disabled_geometric_ratio
    margin: {lower: 0.98, upper: 1.02}
    required_for: [gpu_compute, gpu_transfer, gpu_thermal_power, mixed_cpu_gpu]
  gpu_power:
    unit: W
    aggregation: measured-interval time-weighted mean; raw distribution retained
    effect: enabled_over_disabled_geometric_ratio
    margin: {lower: 0.97, upper: 1.03}
    required_for: [gpu_compute, gpu_transfer, gpu_thermal_power, mixed_cpu_gpu]
  gpu_temperature:
    unit: C
    aggregation: measured-interval time-weighted mean; raw distribution retained
    effect: enabled_minus_disabled
    margin: {lower: -2.0, upper: 2.0}
    required_for: [gpu_compute, gpu_transfer, gpu_thermal_power, mixed_cpu_gpu]
analysis:
  unit: independent_complete_pair
  pilot_pair_count: 12
  pilot_in_final_analysis: false
  minimum_final_pairs: 30
  maximum_final_pairs: 200
  confidence: 0.95
  interval: paired-studentized-max-absolute-t-bootstrap
  bootstrap_resamples: 9999
  resampling_unit: complete_pair_within_workload
  multiplicity: simultaneous-across-all-required-workload-endpoint-conclusions-in-scope
  stopping: fixed-after-pilot-no-optional-stopping
  precision_targets:
    target_elapsed_log_ratio: 0.01
    target_throughput_log_ratio: 0.01
    gpu_sm_clock_log_ratio: 0.01
    gpu_power_log_ratio: 0.015
    gpu_temperature_C: 1.0
raw_observation_schema:
  required_fields:
    - attempt_id
    - evidence_class
    - scope_id
    - sampling_profile
    - workload_id
    - endpoint_id
    - pair_id
    - pilot_or_final
    - arm
    - period
    - order
    - randomization_seed
    - start_timestamp_monotonic_ns
    - end_timestamp_monotonic_ns
    - start_timestamp_utc
    - end_timestamp_utc
    - inclusion_status
    - inclusion_reason
    - observed_value
    - unit
    - raw_distribution_ref
    - input_identity
    - input_digest
    - executable_digest
    - result_digest
    - target_elapsed_distribution_ref
    - target_throughput_distribution_ref
    - sia_cpu_user_seconds
    - sia_cpu_system_seconds
    - sia_rss_peak_bytes
    - sia_rss_time_weighted_bytes
    - sia_io_read_bytes
    - sia_io_write_bytes
    - samples_expected
    - samples_recorded
    - samples_lost
    - sample_loss_rate
    - collector_lateness_p99_ns
    - collector_lateness_max_ns
    - collector_lateness_result
    - target_gpu_clock_distribution_ref
    - target_gpu_power_distribution_ref
    - target_gpu_temperature_distribution_ref
    - target_gpu_throttle_state
    - sia_gpu_activity_value
    - sia_gpu_activity_unit
    - sia_vram_bytes
    - harness_overhead_calibration_ref
    - environment_snapshot_ref
    - source_data_ref
  accounting_rule: every attempted arm is retained; excluded pairs retain both arm rows
  gui_rule: sia_gpu_activity_value, sia_gpu_activity_unit, and sia_vram_bytes are mandatory for every GUI-active trial
  quality_rule: missing sample-loss or collector-lateness fields makes affected results inconclusive
raw_observations: []
result_schema:
  key: [scope_id, workload_id, endpoint_id]
  required_fields:
    - estimate
    - adjusted_interval_lower
    - adjusted_interval_upper
    - confidence
    - margin_lower
    - margin_upper
    - sample_count
    - exclusion_count
    - status
    - reason
  statuses: [pass, fail, inconclusive]
result_matrix:
  - {workload_id: cpu_single, endpoint_ids: [target_elapsed, target_throughput]}
  - {workload_id: cpu_multi, endpoint_ids: [target_elapsed, target_throughput]}
  - {workload_id: memory_pressure, endpoint_ids: [target_elapsed, target_throughput]}
  - {workload_id: disk_io, endpoint_ids: [target_elapsed, target_throughput]}
  - {workload_id: gpu_compute, endpoint_ids: [target_elapsed, target_throughput, gpu_sm_clock, gpu_power, gpu_temperature]}
  - {workload_id: gpu_transfer, endpoint_ids: [target_elapsed, target_throughput, gpu_sm_clock, gpu_power, gpu_temperature]}
  - {workload_id: gpu_thermal_power, endpoint_ids: [target_elapsed, target_throughput, gpu_sm_clock, gpu_power, gpu_temperature]}
  - {workload_id: mixed_cpu_gpu, endpoint_ids: [target_elapsed, target_throughput, gpu_sm_clock, gpu_power, gpu_temperature]}
initial_result_for_every_scope_workload_endpoint:
  estimate: null
  adjusted_interval_lower: null
  adjusted_interval_upper: null
  confidence: 0.95
  margin_source: endpoint_catalog
  sample_count: 0
  exclusion_count: 0
  status: inconclusive
  reason: not_run
  expansion_rule: apply this result to the Cartesian product of scopes and result_matrix entries; materialized measured results must replace each entry independently
overall_conclusions:
  headless_monitor: {status: inconclusive, reason: not_run}
  headless_profile: {status: inconclusive, reason: not_run}
  encrypted_observer: {status: inconclusive, reason: not_run}
  live_gui: {status: inconclusive, reason: not_run}
reporting_rules:
  equivalence: complete adjusted interval must lie strictly inside both margin bounds
  insufficient_evidence: margin overlap, failure to reject a difference test, or favorable point estimate does not establish equivalence
  conflicts: all conflicting endpoint outcomes are reported together
  missing_required_endpoint: inconclusive
  incomplete_precision: inconclusive
  unmatched_development_host: cannot_support_target_claim
  synthetic_only_evidence: cannot_support_target_claim
  uncalibrated_estimate: cannot_support_target_claim