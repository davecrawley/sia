    - accelerator_driver_and_runtime_versions
    - cpu_governor_and_frequency_limits
    - accelerator_power_and_frequency_settings
    - environmental_controls
    - workload_id_and_input_digest
    - harness_version
    - collector_versions
    - clock_source_and_offset
    - harness_calibration
provenance_records: []

