[package]
name = "sia"
version = "0.0.1"
edition = "2021"

[features]
default = ["nvidia"]
nvidia = ["dep:nvml-wrapper"]

[dependencies]
eframe = { version = "0.28.1", features = ["wgpu"] }
egui_plot = "0.28.1"
image = "0.25.8"
libc = "0.2"
nvml-wrapper = { version = "0.11.0", optional = true }
sysinfo = "0.29.11"